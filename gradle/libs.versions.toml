[versions]
about-libraries = "15.3.0"
activity = "1.13.0"
android-gradle-plugin = "9.4.1"
app-icon-loader-coil = "1.5.0"
appcompat = "1.8.0"
# MorpheApp fork until its changes (MorpheApp/ARSCLib#1) land in REAndroid/ARSCLib
# Keep in step with morphe-patcher: Gradle ships only one of the two, picked by comparing hashes as versions
arsclib = "4695b583ef"
coil = "2.7.0"
collection = "0.5.2"
compose-bom = "2026.09.00"
composables-icons = "2.2.1"
datetime = "0.8.0"
dev-tools-gradle-plugin = "2.3.12"
documentfile = "1.1.0"
firebase-bom = "35.1.0"
google-services = "4.5.0"
haze = "2.0.1"
hidden-api-stub = "4.4.0"
hiddenapibypass = "6.2"
koin = "4.2.2"
kotlin = "2.4.21"
kotlin-process = "1.5.1"
kotlinx-coroutines = "1.11.0"
ktor = "3.6.0"
ktx = "1.19.1"
libsu = "6.0.0"
# Ahead of the Compose BOM, which still ships 1.4.0: the sheets build on the 1.5 bottom sheet API
# (rememberBottomSheetState). Drop the override once the BOM ships a stable 1.5.0
material3 = "1.5.0-beta02"
morphe-patcher = "2.1.0-dev.1"
navigation = "2.10.2"
play-services-base = "18.11.1"
preferences-datastore = "1.3.0"
proguard = "7.10.0"
reorderable = "3.1.0"
room-version = "2.8.5"
semver-parser = "3.1.0"
serialization = "1.12.0"
shizuku = "13.1.5"
splash-screen = "1.2.0"
viewmodel-lifecycle = "2.11.0"
work-runtime = "2.12.0"
xz = "1.12"

[libraries]
# AndroidX Core
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "ktx" }
play-services-base = { module = "com.google.android.gms:play-services-base", version.ref = "play-services-base" }
runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "viewmodel-lifecycle" }
runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "viewmodel-lifecycle" }
splash-screen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splash-screen" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work-runtime" }
preferences-datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "preferences-datastore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Haze (blur of what scrolls under floating dialog chrome)
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-blur = { group = "dev.chrisbanes.haze", name = "haze-blur", version.ref = "haze" }

# Coil
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-appiconloader = { group = "me.zhanghai.android.appiconloader", name = "appiconloader-coil", version.ref = "app-icon-loader-coil" }
appiconloader-iconloaderlib = { group = "me.zhanghai.android.appiconloader", name = "appiconloader-iconloaderlib", version.ref = "app-icon-loader-coil" }

# Kotlinx
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-collection-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "collection" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room-version" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room-version" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room-version" }

# Patcher
arsclib = { module = "com.github.MorpheApp:ARSCLib", version.ref = "arsclib" }
morphe-patcher = { group = "app.morphe", name = "morphe-patcher", version.ref = "morphe-patcher" }

# Koin
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
koin-workmanager = { group = "io.insert-koin", name = "koin-androidx-workmanager", version.ref = "koin" }

# About Libraries
about-libraries-core = { group = "com.mikepenz", name = "aboutlibraries-compose-core", version.ref = "about-libraries" }
about-libraries-m3 = { group = "com.mikepenz", name = "aboutlibraries-compose-m3", version.ref = "about-libraries" }

# Ktor
ktor-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Native processes
kotlin-process = { group = "com.github.pgreze", name = "kotlin-process", version.ref = "kotlin-process" }

# HiddenAPI
hidden-api-stub = { group = "dev.rikka.hidden", name = "stub", version.ref = "hidden-api-stub" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
hidden-api-bypass = { group = "org.lsposed.hiddenapibypass", name = "hiddenapibypass", version.ref = "hiddenapibypass" }

# LibSU
libsu-core = { group = "com.github.topjohnwu.libsu", name = "core", version.ref = "libsu" }

# Reorderable lists
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }

# Icons: Material Symbols, and brand logos Material leaves out
icons-material-symbols-rounded = { group = "com.composables", name = "icons-material-symbols-rounded-cmp", version.ref = "composables-icons" }
icons-material-symbols-rounded-filled = { group = "com.composables", name = "icons-material-symbols-rounded-filled-cmp", version.ref = "composables-icons" }
icons-font-awesome-brands = { group = "com.composables", name = "icons-font-awesome-brands-cmp", version.ref = "composables-icons" }

# Semantic versioning parser
semver-parser = { module = "io.github.z4kn4fein:semver", version.ref = "semver-parser" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# Unit tests
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }

# XZ: the build unpacks the JVM builds with it and packs the embedded JVM, which the app unpacks
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
# ProGuard: shrinks the patcher host the embedded JVM runs
proguard = { group = "com.guardsquare", name = "proguard-base", version.ref = "proguard" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
devtools = { id = "com.google.devtools.ksp", version.ref = "dev-tools-gradle-plugin" }
about-libraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "about-libraries" }
about-libraries-android = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "about-libraries" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
