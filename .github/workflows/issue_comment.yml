name: Issue comment

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  wrap-screenshots:
    name: Wrap screenshots
    # Only comments on issues, not on pull requests.
    if: >-
      github.repository_owner == 'MorpheApp' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '<img') || contains(github.event.comment.body, ']('))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/issue-triage
          sparse-checkout-cone-mode: false

      - name: Wrap screenshots
        uses: actions/github-script@v9
        env:
          # Changes are only applied when this repository variable is "live".
          TRIAGE_MODE: ${{ vars.ISSUE_TRIAGE_MODE }}
        with:
          script: |
            const run = require('./.github/scripts/issue-triage/wrap-comment-screenshots.js');
            await run({ github, context, core });
