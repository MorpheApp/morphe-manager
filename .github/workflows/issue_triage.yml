name: Issue triage

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: number

concurrency:
  group: issue-triage-${{ github.event.issue.number || inputs.issue_number }}

permissions: {}

jobs:
  check-template:
    name: Check issue form
    if: github.repository_owner == 'MorpheApp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      triage: ${{ steps.check.outputs.triage }}
      version_problems: ${{ steps.check.outputs.version_problems }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/issue-triage
          sparse-checkout-cone-mode: false

      - name: Delete issues not created with a form
        id: check
        uses: actions/github-script@v9
        env:
          # Deleting issues needs a token from an account with admin access to the repository.
          # It is only used for deleting. Without it, issues are closed instead.
          ISSUE_ADMIN_TOKEN: ${{ secrets.ISSUE_ADMIN_TOKEN }}
        with:
          script: |
            const run = require('./.github/scripts/issue-triage/check-template.js');
            await run({ github, getOctokit, context, core });

  analyze:
    name: Analyze issue
    needs: check-template
    if: needs.check-template.outputs.triage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read only. The issue text is untrusted, so this job gets no write access.
    # The apply job validates the result and makes the changes.
    permissions:
      contents: read
      issues: read
    outputs:
      decision: ${{ steps.analyze.outputs.decision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/issue-triage
          sparse-checkout-cone-mode: false

      - name: Analyze issue
        id: analyze
        uses: actions/github-script@v9
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_TRIAGE_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          VERSION_PROBLEMS: ${{ needs.check-template.outputs.version_problems }}
        with:
          script: |
            const run = require('./.github/scripts/issue-triage/analyze.js');
            await run({ github, context, core });

  apply:
    name: Apply triage
    needs: [check-template, analyze]
    # Also runs if the analyze job failed, so issues with version problems are still closed.
    if: always() && needs.check-template.outputs.triage == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/issue-triage
          sparse-checkout-cone-mode: false

      - name: Apply triage
        uses: actions/github-script@v9
        env:
          DECISION: ${{ needs.analyze.outputs.decision }}
          VERSION_PROBLEMS: ${{ needs.check-template.outputs.version_problems }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          # Changes are only applied when this repository variable is "live".
          # Otherwise, the planned changes are only written to the job summary.
          TRIAGE_MODE: ${{ vars.ISSUE_TRIAGE_MODE }}
        with:
          script: |
            const run = require('./.github/scripts/issue-triage/apply.js');
            await run({ github, context, core });
